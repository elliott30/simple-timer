<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timer</title>
  <link rel="stylesheet" href="timer.css" />
</head>
<body>
  <div id="app">
    <div id="entry-screen">
      <input
        id="time-input"
        type="text"
        placeholder="5:00"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="hint">Enter time as <strong>MM:SS</strong> or <strong>M</strong> for minutes &mdash; press Enter to start</div>
    </div>

    <div id="timer-screen" class="hidden">
      <div id="display">0:00</div>
      <div id="controls">
        <button id="pause-btn">Pause</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>
  </div>
  <script src="timer.js"></script>
</body>
</html>
